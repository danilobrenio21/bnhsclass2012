<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNHS Class of 2012 | 3D Digital Yearbook</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        burgos: {
                            gold: '#D4AF37',
                            navy: '#050C1A',
                            paper: '#FDFBF7',
                            paperDark: '#F4EFE6',
                            ink: '#1E293B'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        handwriting: ['Caveat', 'cursive']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .perspective-2000 { perspective: 2000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        
        /* 3D Book Styling */
        .book-spine-shadow {
            background: linear-gradient(to right, 
                rgba(0,0,0,0.15) 0%, 
                rgba(0,0,0,0.05) 8%, 
                rgba(0,0,0,0) 15%, 
                rgba(0,0,0,0) 85%, 
                rgba(0,0,0,0.05) 92%, 
                rgba(0,0,0,0.15) 100%);
        }
        .center-spine-fold {
            background: linear-gradient(to right, 
                rgba(0,0,0,0.2) 0%, 
                rgba(0,0,0,0.05) 45%, 
                rgba(255,255,255,0.4) 50%, 
                rgba(0,0,0,0.05) 55%, 
                rgba(0,0,0,0.2) 100%);
        }
        .paper-texture {
            background-color: #fdfbf7;
            background-image: radial-gradient(rgba(212, 175, 55, 0.05) 1px, transparent 1px);
            background-size: 16px 16px;
        }

        /* Page Flip Animation */
        .page-turn-left {
            transform-origin: left center;
            transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
        }
        .page-turn-right {
            transform-origin: right center;
            transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050C1A; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
    </style>
</head>
<body class="bg-burgos-navy text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-black">

    <!-- TOP HEADER NAVBAR -->
    <header class="bg-burgos-navy/90 backdrop-blur-xl border-b border-amber-500/20 py-4 px-4 sm:px-8 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-200 text-black flex items-center justify-center font-extrabold text-base shadow-lg shadow-amber-500/20">
                    BNHS
                </div>
                <div>
                    <h1 class="text-white font-bold text-base leading-tight font-serif tracking-wide">Burgos National High School</h1>
                    <p class="text-amber-400 text-xs font-medium tracking-widest uppercase">Class of 2012 Official Digital Yearbook</p>
                </div>
            </div>

            <!-- STATS BADGES (FIXED PANGASINAN OVERFLOW) -->
            <div class="flex items-center gap-2 sm:gap-3 text-xs">
                <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-center">
                    <span class="text-amber-400 font-bold block" id="totalAlumniCount">228</span>
                    <span class="text-[9px] text-slate-400 uppercase">Graduates</span>
                </div>
                <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-center">
                    <span class="text-amber-400 font-bold block">5</span>
                    <span class="text-[9px] text-slate-400 uppercase">Sections</span>
                </div>
                <!-- FIXED PANGASINAN DISPLAY -->
                <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-center">
                    <span class="text-amber-400 font-bold text-xs tracking-tight block">Pangasinan</span>
                    <span class="text-[9px] text-slate-400 uppercase">Origins</span>
                </div>
            </div>
        </div>
    </header>

    <!-- SEARCH & CHAPTER NAVIGATION RIBBONS -->
    <nav class="max-w-7xl mx-auto px-4 w-full mt-6">
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 bg-slate-900/80 p-4 rounded-2xl border border-slate-800 backdrop-blur-md">
            <!-- SECTION CHAPTER RIBBONS -->
            <div class="flex flex-wrap items-center gap-1.5" id="sectionRibbons">
                <!-- Dynamically Populated Section Tabs -->
            </div>

            <!-- QUICK ALUMNI SEARCH -->
            <div class="relative w-full md:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Find graduate name..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-xs text-white focus:outline-none focus:border-amber-400 transition-all">
                <div id="searchResultsDropdown" class="absolute left-0 right-0 top-11 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl max-h-60 overflow-y-auto hidden z-50 p-2"></div>
            </div>
        </div>
    </nav>

    <!-- MAIN 3D YEARBOOK STAGE -->
    <main class="max-w-7xl mx-auto px-2 sm:px-6 my-8 w-full flex-grow flex flex-col items-center justify-center perspective-2000">
        
        <!-- 3D HARDCOVER BOOK WRAPPER -->
        <div class="relative w-full max-w-5xl bg-amber-950/40 rounded-3xl p-3 sm:p-6 shadow-2xl border border-amber-900/40 backdrop-blur-md">
            
            <!-- BOOK SPINE CENTER LINE -->
            <div class="absolute left-1/2 top-0 bottom-0 w-8 -ml-4 center-spine-fold z-30 pointer-events-none hidden md:block"></div>

            <!-- 2-PAGE SPREAD CONTAINER -->
            <div class="grid grid-cols-1 md:grid-cols-2 bg-burgos-paper text-burgos-ink rounded-2xl shadow-2xl border border-amber-200 relative overflow-hidden min-h-[560px] sm:min-h-[620px] book-spine-shadow" id="bookSpread">
                
                <!-- LEFT PAGE: GRADUATE PORTRAIT & BIOGRAPHY -->
                <div class="p-6 sm:p-10 flex flex-col justify-between border-b md:border-b-0 md:border-r border-amber-200/80 relative paper-texture" id="leftPage">
                    <!-- Dynamic Left Page Content -->
                </div>

                <!-- RIGHT PAGE: HIGH SCHOOL MEMORIES & DEDICATION -->
                <div class="p-6 sm:p-10 flex flex-col justify-between relative paper-texture" id="rightPage">
                    <!-- Dynamic Right Page Content -->
                </div>
            </div>
        </div>

        <!-- BOOK FLIP CONTROLS BAR -->
        <div class="flex items-center justify-between max-w-xl w-full mt-6 bg-slate-900/90 border border-slate-800 p-3 rounded-2xl backdrop-blur-md">
            <button onclick="prevPage()" id="prevBtn" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 font-semibold text-xs transition-all flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Previous Graduate
            </button>

            <div class="text-xs text-slate-300 font-medium">
                Page <span id="currentPageNum" class="text-amber-400 font-bold">1</span> of <span id="totalPagesNum">228</span>
            </div>

            <button onclick="nextPage()" id="nextBtn" class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs transition-all flex items-center gap-2 shadow-lg shadow-amber-500/20">
                Next Graduate <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-950 border-t border-slate-800 py-6 text-center text-slate-500 text-xs">
        <p class="font-semibold text-slate-400">Burgos National High School — Class of 2012 Digital Sanctuary</p>
        <p class="mt-1">Poblacion, Burgos, Pangasinan, Philippines</p>
    </footer>

    <script>

                "NACIONAL, GRACE", "SALVADOR, MARK GIL", "NECESITO, MERALYN", "TOLENTINO, LEO JEROME",

            "Amethyst": [

                "BAACAN, ELEANOR", "BALAZON, JONATHAN", "BASUEL, RENALYN", "BARAOED, BENJIE", 
                "BOLATON, MICHELLE", "BONALOS, ALVIN", "BUNAO, CRISANTA", "BUNAO, EFREN", 
                "BUYA, JAYRILYN", "BONIOL, JAN SERGE", "DUMLAO, SHERYL", "BORLAZA, REY MARK",

                "POQUIZ, DANA MAE", "PARAS, ART VINCENT", "PULGA, MICHELLE", "REYES, JUN CRIS", 
                "UGTO, GIRLIE", "VALDERAMA, ANA MARIE"
            ],
            "Emerald": [
                "ALBENDO, JESSAMAE", "BALAOING, JAY-AR", "AMIGABLE, JERRYLYN", "BALONZO JR., ORLINO", 
                "ARGUEL, MARY JANE", "BANTOLINO, JEZRIEL", "BALBALOSA, GEMMA", "BONGAR, CHARLITO", 
                "BALISALISA, EDLYN MAY", "BONILLA, OLIVER", "BONA, JERAMIE", "BONSATO, ANJO", 
                "BONAO, ANNA MARIE", "BURLAZA, JUAN REGO", "BONODE, JESSA", "BUSTRIA, JONATHAN", 
                "BONOSTRO, ME-ANN", "CABESO, ALVIN", "BRECIO, MARYANNE", "DE GUZMAN, ALEXIS", 
                "DE GUZMAN, DONA", "DELOS SANTOS, OLIVER", "DUQUE, KAREN LEE", "DOCTOR, DAYNEES MARK", 
                "ITULARDE, SHERYN", "ELLASOS, ANDY", "MIGANO, MAY ANN", "MENDOZA, ARDEEN",

                "NACAR, CLAIDYN", "NEVADO, JEFREY", "PILON, ABIGAIL", "RAMOS JR., WILLY",

                "SABADO, MYLENE", "TESORO, ROMEL", "TESORO, EVANGELINE", "VIADO, LENI"
            ]
        };

        // CONVERT TO MASTER DEDICATED PAGE ARRAY
        let graduates = [];
        let globalIndex = 1;

        Object.keys(rawBatchData).forEach(sec => {
            rawBatchData[sec].forEach(name => {
                graduates.push({
                    pageNumber: globalIndex++,
                    name: name.trim(),
                    section: sec,
                    quote: "Burgos National High School Batch 2012 forever!",
                    memory: "Unforgettable high school memories in Poblacion, Burgos, Pangasinan."
                });
            });
        });

        document.getElementById('totalAlumniCount').innerText = graduates.length;
        document.getElementById('totalPagesNum').innerText = graduates.length;

        let currentIndex = 0; // 0-based page index

        // RENDER SECTION BOOKMARK RIBBONS
        const ribbonContainer = document.getElementById('sectionRibbons');
        const sectionNames = ["Diamond", "Jade", "Ruby", "Amethyst", "Emerald"];
        
        sectionNames.forEach(sec => {
            const firstGradIndex = graduates.findIndex(g => g.section === sec);
            const btn = document.createElement('button');
            btn.className = 'px-3 py-1 rounded-t-lg text-xs font-bold border transition-all bg-slate-800 text-slate-300 border-slate-700 hover:border-amber-400 hover:text-amber-400';
            btn.innerText = `Sec ${sec}`;
            btn.onclick = () => jumpToPage(firstGradIndex);
            ribbonContainer.appendChild(btn);
        });

        // RENDER DEDICATED 2-PAGE SPREAD FOR CURRENT GRADUATE
        function renderSpread(index) {
            const grad = graduates[index];
            const leftPage = document.getElementById('leftPage');
            const rightPage = document.getElementById('rightPage');

            // LEFT PAGE: DEDICATED PORTRAIT & OFFICIAL PROFILE
            leftPage.innerHTML = `
                <div>
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-xs font-bold uppercase tracking-widest text-amber-700 bg-amber-100 px-3 py-1 rounded-full border border-amber-300">
                            Section ${grad.section}
                        </span>
                        <span class="text-xs font-semibold text-slate-400 font-serif">Page ${grad.pageNumber}</span>
                    </div>

                    <!-- PORTRAIT FRAME -->
                    <div class="w-40 h-40 sm:w-48 sm:h-48 mx-auto rounded-full bg-gradient-to-tr from-amber-400 to-amber-600 p-1.5 shadow-xl mb-6">
                        <div class="w-full h-full rounded-full bg-slate-900 flex items-center justify-center border-4 border-white shadow-inner">
                            <span class="text-white font-extrabold text-5xl sm:text-6xl font-serif">
                                ${grad.name.charAt(0)}
                            </span>
                        </div>
                    </div>

                    <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 text-center font-serif leading-tight mb-2">
                        ${grad.name}
                    </h2>
                    <p class="text-center text-xs font-bold text-amber-700 uppercase tracking-widest">
                        Burgos National High School • Batch 2012
                    </p>
                </div>

                <div class="mt-8 border-t border-amber-200/80 pt-4 text-center">
                    <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-widest block">Home Base</span>
                    <span class="text-xs font-bold text-slate-700">Poblacion, Burgos, Pangasinan</span>
                </div>
            `;

            // RIGHT PAGE: DEDICATION & YEARBOOK NOTES
            rightPage.innerHTML = `
                <div>
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-xs font-bold uppercase tracking-widest text-slate-400">Class Year Book Dedication</span>
                        <span class="text-xs font-semibold text-slate-400 font-serif">Page ${grad.pageNumber}B</span>
                    </div>

                    <!-- SENIOR YEARBOOK QUOTE -->
                    <div class="bg-amber-50/80 border-l-4 border-amber-500 p-5 rounded-r-2xl mb-6 shadow-sm">
                        <span class="text-xs font-bold uppercase tracking-wider text-amber-800 block mb-1">Senior Graduation Quote</span>
                        <p class="text-slate-800 text-base font-handwriting text-xl leading-relaxed">
                            "${grad.quote}"
                        </p>
                    </div>

                    <!-- HIGH SCHOOL MEMORY NOTE -->
                    <div class="bg-white/80 border border-amber-200 p-5 rounded-2xl shadow-sm mb-6">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500 block mb-1">High School Reflection</span>
                        <p class="text-slate-700 text-xs sm:text-sm leading-relaxed">
                            ${grad.memory}
                        </p>
                    </div>
                </div>

                <div class="border-t border-amber-200/80 pt-4 flex justify-between items-center text-xs text-slate-400">
                    <span>Burgos National HS</span>
                    <span class="font-serif italic">Class of 2012</span>
                </div>
            `;

            document.getElementById('currentPageNum').innerText = grad.pageNumber;
            updateButtonStates();
        }

        // PAGE NAVIGATION
        function nextPage() {
            if (currentIndex < graduates.length - 1) {
                currentIndex++;
                renderSpread(currentIndex);
            }
        }

        function prevPage() {
            if (currentIndex > 0) {
                currentIndex--;
                renderSpread(currentIndex);
            }
        }

        function jumpToPage(index) {
            currentIndex = index;
            renderSpread(currentIndex);
        }

        function updateButtonStates() {
            document.getElementById('prevBtn').disabled = (currentIndex === 0);
            document.getElementById('nextBtn').disabled = (currentIndex === graduates.length - 1);
        }

        // KEYBOARD NAVIGATION (LEFT & RIGHT ARROWS)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'ArrowLeft') prevPage();
        });

        // SEARCH DROPDOWN LOGIC
        const searchInput = document.getElementById('searchInput');
        const dropdown = document.getElementById('searchResultsDropdown');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                dropdown.classList.add('hidden');
                return;
            }

            const results = graduates.filter(g => g.name.toLowerCase().includes(query));
            dropdown.innerHTML = '';

            if (results.length === 0) {
                dropdown.innerHTML = `<div class="text-xs text-slate-400 p-2">No graduate found</div>`;
            } else {
                results.forEach(g => {
                    const item = document.createElement('div');
                    item.className = 'p-2 hover:bg-slate-800 rounded-lg cursor-pointer text-xs text-slate-200 flex justify-between items-center';
                    item.innerHTML = `
                        <span class="font-semibold">${g.name}</span>
                        <span class="text-[10px] text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded">Sec ${g.section} (Pg ${g.pageNumber})</span>
                    `;
                    item.onclick = () => {
                        jumpToPage(g.pageNumber - 1);
                        dropdown.classList.add('hidden');
                        searchInput.value = '';
                    };
                    dropdown.appendChild(item);
                });
            }
            dropdown.classList.remove('hidden');
        });

        // INITIAL RENDER
        renderSpread(currentIndex);
    </script>
</body>
</html>
